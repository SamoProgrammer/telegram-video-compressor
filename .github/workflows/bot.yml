name: telegram-video-compressor

on:
  schedule:
    - cron: "7 */5 * * *"
  workflow_dispatch:

concurrency:
  group: telegram-video-compressor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  compress:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Restore bot state
        uses: actions/cache@v4
        with:
          path: |
            /tmp/bot-state.json
            /tmp/bot-mtproto.session
          key: bot-state-${{ github.run_id }}
          restore-keys: |
            bot-state-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Self-check
        run: python -m unittest -v

      - name: MTProto login check
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: python mt_check.py

      - name: Run bot shift
        run: python bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          ALLOWED_USER_IDS: ${{ vars.ALLOWED_USER_IDS }}
          ALLOWED_USERNAMES: ${{ vars.ALLOWED_USERNAMES }}
          BOT_RUN_SECONDS: "19500"
          BOT_RESERVE_SECONDS: "300"
          MAX_INPUT_MB: "20"
          MAX_OUTPUT_MB: "50"
          MAX_DURATION: "3600"
          DISK_BUDGET_MB: "2048"
          BOT_STATE_FILE: "/tmp/bot-state.json"
