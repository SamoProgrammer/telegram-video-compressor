name: telegram-video-compressor

on:
  # Shifts dispatch their successors; bot-watchdog.yml is the cron fallback.
  workflow_dispatch:

concurrency:
  group: telegram-video-compressor
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  compress:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Mark shift start
        run: date +%s > /tmp/shift-start

      - uses: actions/checkout@v4

      - name: Restore encrypted bot state cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /tmp/tg-cache/bot-state.json.enc
            /tmp/tg-cache/bot-mtproto.session.enc
          key: bot-state-encrypted-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            bot-state-encrypted-v1-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Decrypt bot state
        id: decrypt_state
        env:
          BOT_STATE_ENCRYPTION_KEY: ${{ secrets.BOT_STATE_ENCRYPTION_KEY }}
        run: python scripts/secure_state.py restore

      - name: Self-check
        run: python -m unittest -v

      - name: MTProto login check
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          BOT_STATE_FILE: "/tmp/tg-private/bot-state.json"
          BOT_MT_SESSION: "/tmp/tg-private/bot-mtproto.session"
        run: python scripts/mt_check.py

      - name: Run bot shift
        run: python bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          ALLOWED_USER_IDS: ${{ vars.ALLOWED_USER_IDS }}
          ALLOWED_USERNAMES: ${{ vars.ALLOWED_USERNAMES }}
          BOT_RUN_SECONDS: "19500"
          BOT_RESERVE_SECONDS: "300"
          MAX_INPUT_MB: "20"
          MAX_OUTPUT_MB: "50"
          MAX_DURATION: "3600"
          DISK_BUDGET_MB: "2048"
          BOT_STATE_FILE: "/tmp/tg-private/bot-state.json"
          BOT_MT_SESSION: "/tmp/tg-private/bot-mtproto.session"

      - name: Encrypt bot state for cache
        id: encrypt_state
        if: ${{ !cancelled() && steps.decrypt_state.outcome == 'success' }}
        env:
          BOT_STATE_ENCRYPTION_KEY: ${{ secrets.BOT_STATE_ENCRYPTION_KEY }}
        run: python scripts/secure_state.py save

      - name: Save encrypted bot state cache
        if: ${{ !cancelled() && steps.encrypt_state.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: |
            /tmp/tg-cache/bot-state.json.enc
            /tmp/tg-cache/bot-mtproto.session.enc
          key: bot-state-encrypted-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Queue next shift
        # Runs on success and failure, but not on a manual cancel. Skipped
        # for very short runs so a broken setup cannot re-dispatch in a loop.
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          start=$(cat /tmp/shift-start 2>/dev/null || echo 0)
          elapsed=$(( $(date +%s) - start ))
          if [ "$elapsed" -lt 1800 ]; then
            echo "Shift lasted ${elapsed}s; not re-queuing (cron will retry)."
            exit 0
          fi
          default_branch=$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.default_branch')
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/bot.yml/dispatches" -f ref="$default_branch"
          echo "Next shift queued."
