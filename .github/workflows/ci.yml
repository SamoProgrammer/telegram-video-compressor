name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Ensure FFmpeg with libvmaf is available
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/install_vmaf_ffmpeg.sh

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest -v
